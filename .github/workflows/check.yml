# Every push and pull request: both builds compile and the tests pass.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: go test -race ./...
      - run: make build
