# A release of AshCRM Notify: push a tag vX.Y.Z equal to VERSION → tests, the .exe and its .sha256 on GitHub Releases.
# The app checks releases/latest once a day (and by «Проверить обновления») and updates itself after checking SHA-256.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Tests
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test -race ./...
      - name: Build
        run: |
          make build
          cd dist && sha256sum AshCRM-Notify.exe > AshCRM-Notify.exe.sha256 && cat AshCRM-Notify.exe.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## [$(cat VERSION)]" 'index($0, v)==1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" dist/AshCRM-Notify.exe dist/AshCRM-Notify.exe.sha256 \
            --title "AshCRM Notify ${GITHUB_REF_NAME}" --notes "${notes:-AshCRM Notify ${GITHUB_REF_NAME}}"
